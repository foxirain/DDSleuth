name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install native test prerequisites
        run: sudo apt-get update && sudo apt-get install --yes g++ libssl-dev
      - name: Install DDSleuth
        run: python -m pip install --editable .
      - name: Run tests
        run: scripts/test.sh
        env:
          DDSLEUTH_REQUIRE_NATIVE_TESTS: "1"
      - name: Run core smoke test
        run: scripts/run-smoke.sh

  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native test prerequisites
        run: sudo apt-get update && sudo apt-get install --yes g++ libssl-dev
      - name: Install release dependencies
        run: python -m pip install '.[release]'
      - name: Validate the pinned Fast DDS observer overlay
        run: scripts/bootstrap-fastdds.sh "$RUNNER_TEMP/Fast-DDS"
      - name: Run release gate
        run: scripts/release-check.sh
